site_name: PhotoMatch - Projeto de Cloud
site_description: API Django multimodelo (PostgreSQL + pgvector) em Docker na EC2, com documentação RUP
site_url: https://projetos-de-extensao.github.io/PC_CDIA_26.2_8001_II/
repo_url: https://github.com/Projetos-de-Extensao/PC_CDIA_26.2_8001_II
repo_name: PC_CDIA_26.2_8001_II
site_author: Nicholas Borges de Vasconcelos
copyright: Copyright ©️ 2026, PhotoMatch - Projeto de Cloud (PC_CDIA_26.2_8001)

nav:
  - Home: index.md
  - Iniciação:
    - Iniciacao/index.md
    - Documento de Visão: Iniciacao/dv.md
    - Requisitos Suplementares: Iniciacao/rs.md
  - Elaboração:
    - Elaboracao/index.md
    - Casos de Uso Arquiteturais: Elaboracao/cua.md
    - Pacotes e Subsistemas: Elaboracao/maps.md
    - Dimensionamento Computacional: Elaboracao/dim_comp.md
    - Dimensionamento do Banco: Elaboracao/dimrbd.md
    - Sequência e Comunicação: Elaboracao/seq_com.md
  - Transição:
    - Transicao/index.md
    - Atividades de Deploy: Transicao/ativ_deploy.md
    - Validação do Deploy: Transicao/validacao.md

extra_css:
  - css/extra.css

markdown_extensions:
  # Tooltips
  - abbr
  # Admonitions
  - admonition
  # Annotations, Buttons, Grids, Icons & Emojis, Images, Tooltips
  - attr_list
  # Footnotes
  - footnotes
  # Annotations, Grids, Images
  - md_in_html
  # Images
  - pymdownx.blocks.caption
  # Formatting
  - pymdownx.caret
  # Formatting
  - pymdownx.critic
  # Admonitions
  - pymdownx.details
  # Icons & Emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ''
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ''
  # Code Blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Code Blocks
  - pymdownx.inlinehilite
  # Formatting
  - pymdownx.keys
  # Formatting
  - pymdownx.mark
  # Code Blocks, Tooltips
  - pymdownx.snippets
  # Admonitions, Annotations, Code Blocks, Content Tabs, Mermaid diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content Tabs
  - pymdownx.tabbed:
      alternate_style: true
  # Lists
  - pymdownx.tasklist:
      custom_checkbox: true
  # Formatting
  - pymdownx.tilde
  # Data Tables

  - toc:
      permalink: true

plugins:
  - search
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      puml_keyword: plantuml

theme:
  favicon: assets/ibmec_icon.png
  logo: assets/ibmec_logo.png
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono
    
  icon:
    repo: fontawesome/brands/github
    logo: simple/OpenGL
    favicon: simple/OpenGL
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: '#FAB90A'
      accent: '#193257'
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: '#193257'
      accent: '#FAB90A'
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
    - media: all
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference