  - Disciplina:
      - Aulas: Disciplina/aulas.md
      - Iniciação: 
        - Desafios: Disciplina/roteiros/Iniciacao/desafios.md
        - Case Template: Disciplina/roteiros/Iniciacao/case_template.md
        - Documento de Visão Preenchido: Disciplina/roteiros/Iniciacao/dv_template_preenchido.md
        - Requisitos Suplementares: Disciplina/roteiros/Iniciacao/requisitos_suplementares.md
        - Casos de Uso Arquiteturais: Disciplina\roteiros\Iniciacao\casos_uso_arquiteturais.md
        #- Plan3: Disciplina/roteiros/Iniciacao/plan3casetemplate.md
#      - Ambiente: Disciplina/ambiente.md
#      - Roteiro:
#        - 01- AWS: Disciplina/roteiros/02 - aws.md
#        - 04 - EC2: Disciplina/roteiros/04 - ec2.md
#        - 04 - Linux Bash: Disciplina/roteiros/04 - linux.md
#        - 05 - Nginx: Disciplina/roteiros/05 - nginxsite.md
#        - 06 - S3: Disciplina/roteiros/06 - s3.md
#        - 07 - BE: Disciplina/roteiros/07 - eb.md
#        - 10 - Aurora RDS: Disciplina/roteiros/10 - aurora.md
#        - 12 - EB MySQL: Disciplina/roteiros/12 - ebmysql.md
  - Iniciação: 
    - Index: Iniciacao/index.md
    - Documento de Visão Preenchido: Iniciacao/dv.md
    - Requisitos Suplementares: Iniciacao/rs.md
  - Elaboração: 
    - Index: Elaboracao/index.md
    - Casos de Uso Arquiteturais: Elaboracao/cua.md


  - Bibliografia: Disciplina/bibliografia.md

extra_css:
  - css/extra.css

markdown_extensions:
  # Tooltips
  - abbr
  # Admonitions
  - admonition
  # Annotations, Buttons, Grids, Icons & Emojis, Images, Tooltips
  - attr_list
  # Footnotes
  - footnotes
  # Annotations, Grids, Images
  - md_in_html
  # Images
  - pymdownx.blocks.caption
  # Formatting
  - pymdownx.caret
  # Formatting
  - pymdownx.critic
  # Admonitions
  - pymdownx.details
  # Icons & Emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ''
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ''
  # Code Blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Code Blocks
  - pymdownx.inlinehilite
  # Formatting
  - pymdownx.keys
  # Formatting
  - pymdownx.mark
  # Code Blocks, Tooltips
  - pymdownx.snippets
  # Admonitions, Annotations, Code Blocks, Content Tabs
  - pymdownx.superfences
  # Content Tabs
  - pymdownx.tabbed:
      alternate_style: true
  # Lists
  - pymdownx.tasklist:
      custom_checkbox: true
  # Formatting
  - pymdownx.tilde
  # Data Tables

  - toc:
      permalink: true

plugins:
  - search
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      puml_keyword: plantuml

theme:
  favicon: assets/ibmec_icon.png
  logo: assets/ibmec_logo.png
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono
    
  icon:
    repo: fontawesome/brands/github
    logo: simple/OpenGL
    favicon: simple/OpenGL
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: '#FAB90A'
      accent: '#193257'
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: '#193257'
      accent: '#FAB90A'
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
    - media: all
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference